name: Repository quality gates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campushub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campushub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campushub?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/campushub?schema=public
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret-at-least-24-chars
      APP_URL: http://localhost:3000
      SSLCOMMERZ_MODE: sandbox
      SSLCOMMERZ_STORE_ID: ci-store
      SSLCOMMERZ_STORE_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run db:generate
      - run: npm run test:ci
      - run: npm run build
      - name: Smoke-test public routes and anonymous access
        env:
          SMOKE_AUTHENTICATED: "1"
        run: |
          npm run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          node tests/http-smoke.mjs

  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        working-directory: mobile-app
      - run: npm run type-check
        working-directory: mobile-app
      - run: npm run doctor
        working-directory: mobile-app
      - run: npx expo export --platform all
        working-directory: mobile-app
